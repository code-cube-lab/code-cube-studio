  <text x="80" y="335" font-family="Segoe UI, Arial" font-size="82" font-weight="800" fill="#1b211d">ДО ЗАПУСКА</text>
  <g font-family="Segoe UI, Arial" fill="#1b211d">
    <text x="90" y="495" font-size="72" font-weight="800">01</text><text x="230" y="480" font-size="42" font-weight="800">Бриф</text><text x="230" y="525" font-size="27">цель, аудитория, действие</text>
    <line x1="90" y1="565" x2="990" y2="565" stroke="#1b211d" stroke-width="3" opacity=".35"/>
    <text x="90" y="665" font-size="72" font-weight="800">02</text><text x="230" y="650" font-size="42" font-weight="800">Прототип</text><text x="230" y="695" font-size="27">экраны, состав, риски</text>
    <line x1="90" y1="735" x2="990" y2="735" stroke="#1b211d" stroke-width="3" opacity=".35"/>
    <text x="90" y="835" font-size="72" font-weight="800">03</text><text x="230" y="820" font-size="42" font-weight="800">Разработка</text><text x="230" y="865" font-size="27">дизайн, код, интеграции</text>
    <line x1="90" y1="905" x2="990" y2="905" stroke="#1b211d" stroke-width="3" opacity=".35"/>
    <text x="90" y="1005" font-size="72" font-weight="800">04</text><text x="230" y="990" font-size="42" font-weight="800">QA</text><text x="230" y="1035" font-size="27">мобильный вид и ключевой путь</text>
